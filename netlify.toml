[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# TEMPORARY: keep the netlify.app preview out of search engines.
# Remove this block on the day houseofdimah.co.uk is switched over.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
