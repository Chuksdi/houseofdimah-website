[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# TEMPORARY: keep the netlify.app preview out of search engines.
# Remove this block on the day houseofdimah.co.uk is switched over.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# PREVIEW SITE: the studio-preview branch builds a draft-showing copy for the Studio's
# Presentation tab (https://studio-preview--houseofdimah.netlify.app). It is always noindex.
# Its secrets (SANITY_READ_TOKEN, PREVIEW_COOKIE_SECRET) live in Netlify env, never in this repo.
# Keep it in step with main: `git push` here pushes main to both branches (see README).
[context.studio-preview]
  command = "npm run build"
  [context.studio-preview.environment]
    PREVIEW_MODE = "true"
